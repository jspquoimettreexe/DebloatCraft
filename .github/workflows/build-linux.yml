name: Build Linux executable

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tkinter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: Set up Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --noconsole --name DebloatCraft optimizer.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DebloatCraft-linux-x86_64
          path: dist/DebloatCraft

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/DebloatCraft